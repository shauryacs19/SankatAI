name: SankatAI CI

on:
  push:
    branches:
      - main
    
  pull_request:
    types: [opened, synchronize, reopened]


permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend - Test
    runs-on: ubuntu-24.04

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Run Backend tests
        working-directory: backend
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No backend tests directory found - skipping tests"
          fi

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      
      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
        run: npm run build
        
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy-filesystem:
    name: Trivy - Filesystem
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  trivy-iac:
    name: Trivy - Terraform
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Trivy Terraform scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          severity: CRITICAL,HIGH
          exit-code: "1"
  
  docker:
    name: Docker - Build and Scan
    runs-on: ubuntu-24.04

    needs:
      - backend
      - frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build backend Docker image
        run: |
          docker build \
            -t sankatai-backend:${{ github.sha }} \
            ./backend
      
      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sankatai-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: CI completed successfully
        run: echo "All CI checks passed."
