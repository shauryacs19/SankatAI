name: SankatAI CD

# Runs only after "SankatAI CI" finishes. CI gates its image build on both Trivy
# jobs, and this workflow refuses to run unless the whole CI run concluded
# successfully - so a CRITICAL/HIGH finding stops the deploy outright.
#
# Step bodies live in .github/scripts/ so they can be read, linted (shellcheck)
# and run by hand; this file only wires inputs to them.
on:
  workflow_run:
    workflows: ["SankatAI CI"]
    types:
      - completed

permissions:
  contents: read
  id-token: write # OIDC -> AWS_DEPLOY_ROLE_ARN. No static AWS keys.

# One deploy at a time, and never cancel one mid-flight: a cancelled backend
# rollout can leave the instance with no running container.
concurrency:
  group: sankatai-cd
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: sankatai-backend

jobs:
  # ── Web: build, sync to S3, invalidate CloudFront ────────────────────────
  deploy-web:
    name: Deploy web (S3 + CloudFront)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build web app
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
        run: bash .github/scripts/build-web.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3 and invalidate CloudFront
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
          DIST_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: bash .github/scripts/deploy-web.sh

  # ── Backend: build image, push to ECR, roll out on EC2 via SSM ───────────
  deploy-backend:
    name: Deploy backend (ECR + SSM)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          TAG: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/push-backend-image.sh

      - name: Roll out on EC2 via SSM
        env:
          # IMAGE is exported to $GITHUB_ENV by the previous step.
          INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}
          CORS_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          TAG: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/deploy-backend.sh
