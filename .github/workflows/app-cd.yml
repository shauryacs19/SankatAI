name: SankatAI CD

# Called by "SankatAI CI" as a reusable workflow, gated on the REQUIRED CI jobs
# (backend + frontend) only. `needs:` cannot reach across workflow files, and a
# `workflow_run` trigger fires only once the WHOLE upstream workflow finishes -
# which meant SonarQube and Trivy delayed every deploy. Being called instead
# lets CI start this the moment the required jobs go green, while the slower
# security and quality jobs keep running alongside.
#
# Step bodies live in .github/scripts/ so they can be read, linted (shellcheck)
# and run by hand; this file only wires inputs to them.
on:
  workflow_call:
  # Manual re-deploy of whatever is currently on the selected branch.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC -> AWS_DEPLOY_ROLE_ARN. No static AWS keys.

# One deploy at a time, and never cancel one mid-flight: a cancelled backend
# rollout can leave the instance with no running container.
concurrency:
  group: sankatai-cd
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  # ── Resource IDs, straight from Terraform state ──────────────────────────
  # Single source of truth. Bucket names, distribution id, instance id, ECR URL
  # and Cognito ids are all READ from the state that `terraform apply` wrote -
  # never duplicated into GitHub variables, which go stale silently when a
  # resource is replaced.
  terraform-outputs:
    name: Read Terraform outputs
    runs-on: ubuntu-24.04

    outputs:
      frontend_bucket: ${{ steps.tf.outputs.frontend_bucket }}
      cloudfront_distribution_id: ${{ steps.tf.outputs.cloudfront_distribution_id }}
      cloudfront_domain_name: ${{ steps.tf.outputs.cloudfront_domain_name }}
      backend_instance_id: ${{ steps.tf.outputs.backend_instance_id }}
      ecr_repository_url: ${{ steps.tf.outputs.ecr_repository_url }}
      api_gateway_endpoint: ${{ steps.tf.outputs.api_gateway_endpoint }}
      cognito_user_pool_id: ${{ steps.tf.outputs.cognito_user_pool_id }}
      cognito_user_pool_client_id: ${{ steps.tf.outputs.cognito_user_pool_client_id }}
      users_table_name: ${{ steps.tf.outputs.users_table_name }}
      chat_history_table_name: ${{ steps.tf.outputs.chat_history_table_name }}
      attachments_table_name: ${{ steps.tf.outputs.attachments_table_name }}
      chat_bucket_name: ${{ steps.tf.outputs.chat_bucket_name }}
      documents_bucket_name: ${{ steps.tf.outputs.documents_bucket_name }}
      ai_api_key_secret_name: ${{ steps.tf.outputs.ai_api_key_secret_name }}
      admins_table_name: ${{ steps.tf.outputs.admins_table_name }}
      admin_invitations_table_name: ${{ steps.tf.outputs.admin_invitations_table_name }}
      admin_audit_table_name: ${{ steps.tf.outputs.admin_audit_table_name }}
      analytics_events_table_name: ${{ steps.tf.outputs.analytics_events_table_name }}
      analytics_agg_table_name: ${{ steps.tf.outputs.analytics_agg_table_name }}
      analytics_salt_secret_name: ${{ steps.tf.outputs.analytics_salt_secret_name }}
      api_gateway_id: ${{ steps.tf.outputs.api_gateway_id }}
      app_url: ${{ steps.tf.outputs.app_url }}
      ses_sender_email: ${{ steps.tf.outputs.ses_sender_email }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # keep stdout clean for `output -json`

      - name: Read outputs
        id: tf
        run: bash .github/scripts/terraform-outputs.sh

  # ── Web: build, sync to S3, invalidate CloudFront ────────────────────────
  deploy-web:
    name: Deploy web (S3 + CloudFront)
    needs: terraform-outputs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build web app
        env:
          # Not a resource id - a routing choice. CloudFront proxies /api/* to
          # API Gateway, so the app calls a relative path.
          VITE_API_URL: ${{ vars.VITE_API_URL || '/' }}
          VITE_COGNITO_USER_POOL_ID: ${{ needs.terraform-outputs.outputs.cognito_user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ needs.terraform-outputs.outputs.cognito_user_pool_client_id }}
        run: bash .github/scripts/build-web.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3 and invalidate CloudFront
        env:
          BUCKET: ${{ needs.terraform-outputs.outputs.frontend_bucket }}
          DIST_ID: ${{ needs.terraform-outputs.outputs.cloudfront_distribution_id }}
        run: bash .github/scripts/deploy-web.sh

  # ── Backend: build image, push to ECR, roll out on EC2 via SSM ───────────
  deploy-backend:
    name: Deploy backend (ECR + SSM)
    needs: terraform-outputs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REPOSITORY_URL: ${{ needs.terraform-outputs.outputs.ecr_repository_url }}
          TAG: ${{ github.sha }}
        run: bash .github/scripts/push-backend-image.sh

      - name: Roll out on EC2 via SSM
        env:
          # IMAGE is exported to $GITHUB_ENV by the previous step.
          # Instance id comes from Terraform state; the script verifies it is
          # running and falls back to Name-tag discovery if it is not.
          INSTANCE_ID: ${{ needs.terraform-outputs.outputs.backend_instance_id }}
          INSTANCE_NAME_TAG: sankatai-backend
          CORS_ORIGINS: https://${{ needs.terraform-outputs.outputs.cloudfront_domain_name }}
          USERS_TABLE: ${{ needs.terraform-outputs.outputs.users_table_name }}
          CHAT_HISTORY_TABLE: ${{ needs.terraform-outputs.outputs.chat_history_table_name }}
          ATTACHMENTS_TABLE: ${{ needs.terraform-outputs.outputs.attachments_table_name }}
          CHAT_BUCKET: ${{ needs.terraform-outputs.outputs.chat_bucket_name }}
          DOCUMENTS_BUCKET: ${{ needs.terraform-outputs.outputs.documents_bucket_name }}
          SECRET_ID: ${{ needs.terraform-outputs.outputs.ai_api_key_secret_name }}
          COGNITO_USER_POOL_ID: ${{ needs.terraform-outputs.outputs.cognito_user_pool_id }}
          COGNITO_APP_CLIENT_ID: ${{ needs.terraform-outputs.outputs.cognito_user_pool_client_id }}
          ADMINS_TABLE: ${{ needs.terraform-outputs.outputs.admins_table_name }}
          ADMIN_INVITATIONS_TABLE: ${{ needs.terraform-outputs.outputs.admin_invitations_table_name }}
          ADMIN_AUDIT_TABLE: ${{ needs.terraform-outputs.outputs.admin_audit_table_name }}
          ANALYTICS_EVENTS_TABLE: ${{ needs.terraform-outputs.outputs.analytics_events_table_name }}
          ANALYTICS_AGG_TABLE: ${{ needs.terraform-outputs.outputs.analytics_agg_table_name }}
          ANALYTICS_SALT_SECRET_ID: ${{ needs.terraform-outputs.outputs.analytics_salt_secret_name }}
          API_GATEWAY_ID: ${{ needs.terraform-outputs.outputs.api_gateway_id }}
          APP_URL: ${{ needs.terraform-outputs.outputs.app_url }}
          SES_SENDER_EMAIL: ${{ needs.terraform-outputs.outputs.ses_sender_email }}
          TAG: ${{ github.sha }}
        run: bash .github/scripts/deploy-backend.sh
