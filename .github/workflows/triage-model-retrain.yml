name: Triage model retrain

# Weekly: rebuild the severity model from the public dataset + synthetic labels
# + the last 6 months of anonymised Yes/No feedback, evaluate it against the
# model in production on the same data, and promote it ONLY if no gated metric
# regresses (macro-F1, under-triage, HIGH+ recall, feedback accuracy) and every
# red-flag safety case still ends as EMERGENCY. Otherwise the candidate stays in
# S3 unserved. The backend picks up a promotion within ~10 minutes; roll back
# with `python -m scripts.severity_model rollback --bucket ...`.
#
# Runs on GitHub's runner (free), not on AWS compute. Role: the Terraform output
# model_retrain_role_arn, stored as the secret AWS_RETRAIN_ROLE_ARN.
on:
  schedule:
    - cron: "30 21 * * 0" # Monday 03:00 IST
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote if the gate passes"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: triage-model-retrain
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ML_ARTIFACTS_BUCKET: ${{ vars.ML_ARTIFACTS_BUCKET || 'sankatai-ml-artifacts' }}
  TRIAGE_FEEDBACK_TABLE: ${{ vars.TRIAGE_FEEDBACK_TABLE || 'sankatai-triage-feedback' }}

jobs:
  retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ml.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-ml.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RETRAIN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Retrain, evaluate, promote if not worse
        env:
          PROMOTE: ${{ github.event_name == 'schedule' || inputs.promote }}
        run: |
          args=(retrain --bucket "$ML_ARTIFACTS_BUCKET" --table "$TRIAGE_FEEDBACK_TABLE" --region "$AWS_REGION" --download)
          if [ "$PROMOTE" = "true" ]; then args+=(--promote); fi
          python -m scripts.severity_model "${args[@]}" | tee retrain.json

      - name: Keep the evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-report
          path: backend/retrain.json
          retention-days: 90
