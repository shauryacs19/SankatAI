sonar.projectKey=shauryacs19_SankatAI
sonar.organization=shauryacs19


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=SankatAI
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Coverage reports produced by the backend and frontend CI jobs (app-ci.yml).
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

# Not counted toward coverage: dev-only previews, style objects, build
# scripts, the tests themselves, the mobile app (no unit tests; its shared
# logic is tested through the web) and Terraform.
sonar.coverage.exclusions=apps/web/src/dev/**,**/*.styles.js,apps/web/scripts/**,**/*.test.*,backend/tests/**,apps/mobile/**,infrastructure/**
